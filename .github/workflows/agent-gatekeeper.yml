name: Agent Gatekeeper

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: read

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Verify AGENTS.md exists
        run: |
          if [ ! -f AGENTS.md ]; then
            echo "Error: AGENTS.md is missing!"
            exit 1
          fi
          echo "AGENTS.md exists."

      - name: Install dependencies
        run: npm ci

      - name: Run Astro Check
        run: npm run astro check

      - name: Run tests
        run: npm run test:ci || echo "No tests defined"

      - name: Build project
        run: npm run build
